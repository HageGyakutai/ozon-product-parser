services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ozon
      POSTGRES_USER: ozon
      POSTGRES_PASSWORD: local_only_change_me
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ozon -d ozon"]
      interval: 5s
      timeout: 3s
      retries: 10
  migrate:
    build: .
    environment:
      DATABASE_URL: postgresql+psycopg://ozon:local_only_change_me@postgres:5432/ozon
    command: ["alembic", "upgrade", "head"]
    depends_on:
      postgres:
        condition: service_healthy
  parser:
    build: .
    profiles: ["parse"]
    environment:
      DATABASE_URL: postgresql+psycopg://ozon:local_only_change_me@postgres:5432/ozon
      OZON_COOKIES_FILE: /app/cookies.json
    volumes:
      - ./cookies.json:/app/cookies.json:ro
    entrypoint: ["python", "scripts/parse_ozon.py"]
    depends_on:
      migrate:
        condition: service_completed_successfully
volumes:
  postgres_data:
