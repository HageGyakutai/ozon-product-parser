[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[project]
name = "ozon-product-parser"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["requests>=2.32,<3", "beautifulsoup4>=4.12,<5", "SQLAlchemy>=2.0,<3", "alembic>=1.13,<2", "psycopg[binary]>=3.2,<4", "python-dotenv>=1,<2", "google-api-python-client>=2,<3", "google-auth-oauthlib>=1,<2", "playwright>=1.50,<2"]
[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.13,<1"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
[tool.setuptools.packages.find]
where = ["src"]
