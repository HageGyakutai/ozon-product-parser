name: Python checks
on:
  push:
  pull_request:
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - name: Start healthy PostgreSQL and run Alembic
        run: docker compose up --build --exit-code-from migrate migrate
      - name: Check migrated table and create isolated test database
        run: |
          docker compose up -d --wait postgres
          docker compose exec -T postgres psql -U ozon -d ozon -Atc "SELECT to_regclass('public.products')" | grep -qx products
          docker compose exec -T postgres createdb -U ozon ozon_test
      - name: Run tests against PostgreSQL
        env:
          TEST_DATABASE_URL: postgresql+psycopg://ozon:local_only_change_me@localhost:5432/ozon_test
        run: uv run pytest -q
